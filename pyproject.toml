[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-options-scanner"
version = "0.1.0"
description = "Production-ready weekly options premium selling recommendation framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "google-genai>=1.13.0",
  "httpx>=0.27.2",
  "moomoo-api>=10.2.0",
  "numpy>=2.1.0",
  "pandas>=2.2.3",
  "pandas-ta>=0.3.14b0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "python-dotenv>=1.0.1",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "streamlit>=1.40.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.7.2",
  "mypy>=1.13.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
markers = [
  "live: marks tests that hit live external providers",
  "e2e: marks end-to-end live pipeline tests"
]
filterwarnings = [
  "ignore:Call to deprecated create function EnumValueDescriptor:DeprecationWarning:moomoo.*",
  "ignore:Call to deprecated create function FileDescriptor:DeprecationWarning:moomoo.*",
  "ignore:setDaemon.*is deprecated:DeprecationWarning:moomoo.*",
  "ignore:datetime.datetime.utcfromtimestamp.*is deprecated:DeprecationWarning:google.*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
